name: Release Please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}

      - name: Regenerate integrity hashes
        if: ${{ steps.release.outputs.pr }}
        run: |
          find . -name "SKILL.md" -not -path './.git/*' -exec sha256sum {} \; | sort > .skill-hashes.sha256
          find . -path './plugins/*/skills/*/*.md' -not -path './.git/*' -exec sha256sum {} \; | sort >> .skill-hashes.sha256
          find . -path './plugins/*/.claude-plugin/plugin.json' -exec sha256sum {} \; >> .skill-hashes.sha256

      - name: Push hash update to release PR
        if: ${{ steps.release.outputs.pr }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .skill-hashes.sha256
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate integrity hashes"
            git push
          fi
