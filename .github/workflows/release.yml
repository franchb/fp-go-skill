name: Release with Provenance
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create deterministic archive
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          git archive --format=tar.gz --prefix=fp-go-skill-${TAG}/ \
            -o fp-go-skill-${TAG}.tar.gz HEAD
          sha256sum fp-go-skill-${TAG}.tar.gz > SHA256SUMS.txt
      - id: hash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "hashes=$(sha256sum fp-go-skill-${TAG}.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'fp-go-skill-*.tar.gz'
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" fp-go-skill-${TAG}.tar.gz SHA256SUMS.txt \
            --title "$TAG" --generate-notes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            fp-go-skill-*.tar.gz
            SHA256SUMS.txt
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
